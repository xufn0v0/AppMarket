name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Unit and UI Tests
        run: ./gradlew :app:shared:desktopTest :data:desktopTest --console=plain

      - name: Decode Signing Key
        # secrets cannot be referenced in an `if:` expression, so the secret is
        # mapped to an env var and the presence check happens inside the script.
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          # No signing secret configured: skip and let the build use its debug
          # signing fallback (it only checks whether KEYSTORE_PATH exists).
          if [ -z "$SIGNING_KEY" ]; then
            echo "No SIGNING_KEY secret provided, release will be debug-signed"
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" | base64 -d > keystore.jks
          # Fail fast if the decoded secret is empty or not a valid keystore, instead of
          # producing a corrupt file that breaks signing with an unrelated error later.
          if [ ! -s keystore.jks ] ||
             ! keytool -list -keystore keystore.jks -storepass "$KEYSTORE_PASS" >/dev/null 2>&1; then
            echo "::error::SIGNING_KEY is not a valid keystore"
            exit 1
          fi
          # Only expose the signing path when a verified keystore exists.
          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          set -euo pipefail
          ./gradlew :app:android:assembleRelease --console=plain
          APK_FILE="$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Release APK was not produced"
            exit 1
          fi
          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"
        env:
          # KEYSTORE_PATH is injected via GITHUB_ENV only when a valid keystore exists;
          # redeclaring it here would set it to an empty string and break the null check
          # that triggers the debug-signing fallback.
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-market-android
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Display APK Hashes
        run: |
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
